openapi: "3.1.0"
info:
  title: "WPRUS communication API"
  version: "2.4.0"
  description: "Send encrypted JSON through HTTPS. Server-to-server POST requests use JSON with wprusdata and token, except token requests which use wprusdata alone. Browser login and logout use GET query parameters. The x-wprus-decrypted-schema field describes the JSON to encrypt."
externalDocs:
  description: "Connection setup, examples and protocol"
  url: "https://github.com/froger-me/wp-remote-users-sync/blob/main/docs/api/README.md"
servers:
  -
    url: "https://receiver.example"
    description: "Replace with full receiving site base URL, including any subdirectory"
tags:
  -
    name: "Tokens"
  -
    name: "Identity"
  -
    name: "Accounts"
  -
    name: "Administration"
  -
    name: "Browser sessions"
paths:
  "/wprus/token/":
    post:
      tags:
        - "Tokens"
      operationId: "issueToken"
      summary: "Issue a security token"
      description: "Send application/json containing only encrypted wprusdata; the decrypted base_url identifies the receiver."
      x-wprus-decrypted-schema:
        "$ref": "#/components/schemas/TokenRequest"
      requestBody:
        "$ref": "#/components/requestBodies/TokenEnvelope"
      x-wprus-error-codes:
        "400":
          - "invalid_token_request"
        "500":
          - "token_creation_failed"
      responses:
        "200":
          "$ref": "#/components/responses/TokenIssued"
        "400":
          "$ref": "#/components/responses/RequestError"
        "500":
          "$ref": "#/components/responses/RequestError"
  "/wprus/identity/":
    post:
      tags:
        - "Identity"
      operationId: "checkIdentity"
      summary: "Check username and email existence"
      description: "Send application/json with encrypted wprusdata and the issued token."
      x-wprus-decrypted-schema:
        "$ref": "#/components/schemas/IdentityRequest"
      requestBody:
        "$ref": "#/components/requestBodies/ActionEnvelope"
      x-wprus-error-codes:
        "400":
          - "invalid_identity_request"
        "403":
          - "invalid_token"
          - "ip_not_allowed"
          - "method_not_allowed"
      responses:
        "200":
          "$ref": "#/components/responses/IdentityChecked"
        "400":
          "$ref": "#/components/responses/RequestError"
        "403":
          "$ref": "#/components/responses/RequestError"
  "/wprus/create/":
    post:
      tags:
        - "Accounts"
      operationId: "createAccount"
      summary: "Create an account"
      description: "Send application/json with encrypted wprusdata and the issued token."
      x-wprus-decrypted-schema:
        "$ref": "#/components/schemas/CreateRequest"
      requestBody:
        "$ref": "#/components/requestBodies/ActionEnvelope"
      x-wprus-error-codes:
        "400":
          - "invalid_create_request"
        "403":
          - "invalid_token"
          - "ip_not_allowed"
          - "method_not_allowed"
          - "create_not_allowed"
          - "role_sync_disabled"
        "409":
          - "identity_mismatch"
          - "existing_user_login"
          - "existing_user_email"
        "422":
          - "user_creation_failed"
          - "role_not_allowed"
      x-wprus-error-details:
        role_sync_disabled:
          "$ref": "#/components/schemas/RoleErrorDetails"
        role_not_allowed:
          "$ref": "#/components/schemas/RoleErrorDetails"
      responses:
        "200":
          "$ref": "#/components/responses/ActionSucceeded"
        "400":
          "$ref": "#/components/responses/RequestError"
        "403":
          "$ref": "#/components/responses/RequestError"
        "409":
          "$ref": "#/components/responses/RequestError"
        "422":
          "$ref": "#/components/responses/RequestError"
  "/wprus/update/":
    post:
      tags:
        - "Accounts"
      operationId: "updateAccount"
      summary: "Update an account"
      description: "Send application/json with encrypted wprusdata and the issued token."
      x-wprus-decrypted-schema:
        "$ref": "#/components/schemas/UpdateRequest"
      requestBody:
        "$ref": "#/components/requestBodies/ActionEnvelope"
      x-wprus-error-codes:
        "400":
          - "invalid_update_request"
        "403":
          - "invalid_token"
          - "ip_not_allowed"
          - "method_not_allowed"
          - "update_not_allowed"
          - "role_sync_disabled"
        "404":
          - "user_not_found"
        "409":
          - "identity_mismatch"
          - "existing_user_login"
          - "existing_user_email"
        "422":
          - "user_update_failed"
          - "role_not_allowed"
      x-wprus-error-details:
        role_sync_disabled:
          "$ref": "#/components/schemas/RoleErrorDetails"
        role_not_allowed:
          "$ref": "#/components/schemas/RoleErrorDetails"
      responses:
        "200":
          "$ref": "#/components/responses/ActionSucceeded"
        "400":
          "$ref": "#/components/responses/RequestError"
        "403":
          "$ref": "#/components/responses/RequestError"
        "404":
          "$ref": "#/components/responses/RequestError"
        "409":
          "$ref": "#/components/responses/RequestError"
        "422":
          "$ref": "#/components/responses/RequestError"
  "/wprus/delete/":
    post:
      tags:
        - "Accounts"
      operationId: "deleteAccount"
      summary: "Delete an account"
      description: "Send application/json with encrypted wprusdata and the issued token."
      x-wprus-decrypted-schema:
        "$ref": "#/components/schemas/DeleteRequest"
      requestBody:
        "$ref": "#/components/requestBodies/ActionEnvelope"
      x-wprus-error-codes:
        "400":
          - "invalid_delete_request"
        "403":
          - "invalid_token"
          - "ip_not_allowed"
          - "method_not_allowed"
          - "delete_not_allowed"
        "404":
          - "user_not_found"
        "409":
          - "identity_mismatch"
        "422":
          - "user_deletion_failed"
          - "reassignment_user_not_found"
      x-wprus-error-details:
        reassignment_user_not_found:
          "$ref": "#/components/schemas/ReassignmentErrorDetails"
      responses:
        "200":
          "$ref": "#/components/responses/ActionSucceeded"
        "400":
          "$ref": "#/components/responses/RequestError"
        "403":
          "$ref": "#/components/responses/RequestError"
        "404":
          "$ref": "#/components/responses/RequestError"
        "409":
          "$ref": "#/components/responses/RequestError"
        "422":
          "$ref": "#/components/responses/RequestError"
  "/wprus/password/":
    post:
      tags:
        - "Accounts"
      operationId: "setPassword"
      summary: "Change account password"
      description: "Send application/json with encrypted wprusdata and the issued token."
      x-wprus-decrypted-schema:
        "$ref": "#/components/schemas/PasswordRequest"
      requestBody:
        "$ref": "#/components/requestBodies/ActionEnvelope"
      x-wprus-error-codes:
        "400":
          - "invalid_password_request"
        "403":
          - "invalid_token"
          - "ip_not_allowed"
          - "method_not_allowed"
          - "password_not_allowed"
        "404":
          - "user_not_found"
        "409":
          - "identity_mismatch"
      responses:
        "200":
          "$ref": "#/components/responses/ActionSucceeded"
        "400":
          "$ref": "#/components/responses/RequestError"
        "403":
          "$ref": "#/components/responses/RequestError"
        "404":
          "$ref": "#/components/responses/RequestError"
        "409":
          "$ref": "#/components/responses/RequestError"
  "/wprus/meta/":
    post:
      tags:
        - "Accounts"
      operationId: "changeMetadata"
      summary: "Change account metadata"
      description: "Send application/json with encrypted wprusdata and the issued token."
      x-wprus-decrypted-schema:
        "$ref": "#/components/schemas/MetadataRequest"
      requestBody:
        "$ref": "#/components/requestBodies/ActionEnvelope"
      x-wprus-error-codes:
        "400":
          - "invalid_metadata_request"
        "403":
          - "invalid_token"
          - "ip_not_allowed"
          - "method_not_allowed"
          - "metadata_not_allowed"
          - "metadata_not_configured"
        "404":
          - "user_not_found"
        "409":
          - "identity_mismatch"
        "422":
          - "invalid_metadata_request"
          - "metadata_key_invalid"
          - "metadata_key_not_allowed"
          - "metadata_change_failed"
          - "metadata_partial_failure"
      x-wprus-error-details:
        metadata_key_invalid:
          "$ref": "#/components/schemas/MetadataErrorDetails"
        metadata_key_not_allowed:
          "$ref": "#/components/schemas/MetadataErrorDetails"
        metadata_change_failed:
          "$ref": "#/components/schemas/MetadataErrorDetails"
        metadata_partial_failure:
          "$ref": "#/components/schemas/MetadataErrorDetails"
      responses:
        "200":
          "$ref": "#/components/responses/ActionSucceeded"
        "400":
          "$ref": "#/components/responses/RequestError"
        "403":
          "$ref": "#/components/responses/RequestError"
        "404":
          "$ref": "#/components/responses/RequestError"
        "409":
          "$ref": "#/components/responses/RequestError"
        "422":
          "$ref": "#/components/responses/RequestError"
  "/wprus/wp-admin/":
    post:
      tags:
        - "Administration"
      operationId: "adminRequest"
      summary: "Check permissions or outgoing metadata"
      description: "Send application/json with encrypted wprusdata and the issued token."
      x-wprus-decrypted-schema:
        "$ref": "#/components/schemas/AdminRequest"
      requestBody:
        "$ref": "#/components/requestBodies/ActionEnvelope"
      x-wprus-error-codes:
        "400":
          - "wprus_invalid_admin_request"
          - "wprus_unknown_admin_action"
          - "wprus_invalid_ping"
          - "wprus_invalid_outgoing_meta_request"
          - "wprus_unknown_outgoing_meta_site"
        "403":
          - "invalid_token"
          - "ip_not_allowed"
          - "method_not_allowed"
          - "wprus_ping_disabled"
        "500":
          - "wprus_admin_no_result"
      responses:
        "200":
          "$ref": "#/components/responses/AdminSucceeded"
        "400":
          "$ref": "#/components/responses/RequestError"
        "403":
          "$ref": "#/components/responses/RequestError"
        "500":
          "$ref": "#/components/responses/RequestError"
  "/wprus/login/":
    get:
      tags:
        - "Browser sessions"
      operationId: "browserLogin"
      summary: "Establish browser login"
      description: "Use a single-use GET token and open in the visiting browser."
      x-wprus-decrypted-schema:
        "$ref": "#/components/schemas/LoginRequest"
      parameters:
        -
          "$ref": "#/components/parameters/EncryptedQuery"
        -
          "$ref": "#/components/parameters/TokenQuery"
      responses:
        "200":
          "$ref": "#/components/responses/BrowserProcessed"
        "303":
          "$ref": "#/components/responses/BrowserRedirect"
        "400":
          "$ref": "#/components/responses/BrowserProcessed"
        "403":
          "$ref": "#/components/responses/BrowserProcessed"
        "404":
          "$ref": "#/components/responses/BrowserProcessed"
        "409":
          "$ref": "#/components/responses/BrowserProcessed"
  "/wprus/logout/":
    get:
      tags:
        - "Browser sessions"
      operationId: "browserLogout"
      summary: "End browser session"
      description: "Use a single-use GET token and open in the visiting browser."
      x-wprus-decrypted-schema:
        "$ref": "#/components/schemas/LogoutRequest"
      parameters:
        -
          "$ref": "#/components/parameters/EncryptedQuery"
        -
          "$ref": "#/components/parameters/TokenQuery"
      responses:
        "200":
          "$ref": "#/components/responses/BrowserProcessed"
        "303":
          "$ref": "#/components/responses/BrowserRedirect"
        "400":
          "$ref": "#/components/responses/BrowserProcessed"
        "403":
          "$ref": "#/components/responses/BrowserProcessed"
        "404":
          "$ref": "#/components/responses/BrowserProcessed"
        "409":
          "$ref": "#/components/responses/BrowserProcessed"
    post:
      tags:
        - "Browser sessions"
      operationId: "postLogout"
      summary: "Process logout notification"
      description: "Send application/json with encrypted wprusdata and the issued token."
      x-wprus-decrypted-schema:
        "$ref": "#/components/schemas/LogoutRequest"
      requestBody:
        "$ref": "#/components/requestBodies/ActionEnvelope"
      x-wprus-error-codes:
        "400":
          - "invalid_logout_request"
        "403":
          - "invalid_token"
          - "ip_not_allowed"
          - "method_not_allowed"
          - "logout_not_allowed"
        "404":
          - "user_not_found"
        "409":
          - "identity_mismatch"
          - "already_logged_out"
          - "session_mismatch"
      responses:
        "200":
          "$ref": "#/components/responses/ActionSucceeded"
        "400":
          "$ref": "#/components/responses/RequestError"
        "403":
          "$ref": "#/components/responses/RequestError"
        "404":
          "$ref": "#/components/responses/RequestError"
        "409":
          "$ref": "#/components/responses/RequestError"
components:
  parameters:
    EncryptedQuery:
      name: "wprusdata"
      in: "query"
      required: true
      schema:
        type: "string"
    TokenQuery:
      name: "token"
      in: "query"
      required: true
      schema:
        type: "string"
  requestBodies:
    TokenEnvelope:
      required: true
      content:
        "application/json":
          schema:
            type: "object"
            additionalProperties: false
            required:
              - "wprusdata"
            properties:
              wprusdata:
                type: "string"
                description: "Encrypted JSON message"
          example:
            wprusdata: "<encrypted-token-request>"
    ActionEnvelope:
      required: true
      content:
        "application/json":
          schema:
            type: "object"
            additionalProperties: false
            required:
              - "wprusdata"
              - "token"
            properties:
              wprusdata:
                type: "string"
                description: "Encrypted JSON message"
              token:
                type: "string"
                description: "Nonce issued by /wprus/token/"
          example:
            wprusdata: "<encrypted-message>"
            token: "<issued-nonce>"
  responses:
    TokenIssued:
      description: "Token and expiration time"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/TokenResponse"
    IdentityChecked:
      description: "Username and email existence results"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/IdentityResponse"
    ActionSucceeded:
      description: "Operation completed"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ActionSuccessResponse"
    AdminSucceeded:
      description: "Administrative request completed"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/AdminSuccessResponse"
    RequestError:
      description: "Unsuccessful request. Use data.code and optional data.details to determine the cause and any completed changes."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
          examples:
            email_conflict:
              summary: "Email address already belongs to an account (409)"
              value:
                success: false
                data:
                  code: "existing_user_email"
            role_rejected:
              summary: "The account was saved but one role was rejected (422)"
              value:
                success: false
                data:
                  code: "role_not_allowed"
                  details:
                    account_saved: true
                    applied_roles:
                      - "editor"
                    rejected_roles:
                      - "administrator"
            reassignment_failed:
              summary: "Account deleted without content reassignment (422)"
              value:
                success: false
                data:
                  code: "reassignment_user_not_found"
                  details:
                    account_deleted: true
                    content_reassigned: false
            metadata_partially_applied:
              summary: "One metadata operation succeeded and another was rejected (422)"
              value:
                success: false
                data:
                  code: "metadata_partial_failure"
                  details:
                    applied: 1
                    rejected:
                      -
                        operation: "add"
                        key: "restricted_key"
                        code: "metadata_key_not_allowed"
    BrowserProcessed:
      description: "Browser session response; may include session cookies"
    BrowserRedirect:
      description: "Redirect to browser destination"
      headers:
        Location:
          schema:
            type: "string"
  schemas:
    TokenRequest:
      type: "object"
      required:
        - "method"
        - "base_url"
      properties:
        action:
          type: "string"
          description: "Operation name"
        method:
          type: "string"
          enum:
            - "post"
            - "get"
        base_url:
          type: "string"
          description: "Receiver base URL"
          format: "uri"
    TokenResponse:
      type: "object"
      required:
        - "nonce"
        - "expiry"
      properties:
        nonce:
          type: "string"
          minLength: 1
        expiry:
          type: "integer"
          description: "Expiration in Unix seconds"
    BaseRequest:
      type: "object"
      required:
        - "username"
        - "base_url"
      properties:
        username:
          type: "string"
          description: "Account login at receiver"
          minLength: 1
        base_url:
          type: "string"
          description: "Registered sender base URL"
          format: "uri"
        identity_email:
          type: "string"
          description: "Existing account email; previous email when changing address"
          format: "email"
    IdentityRequest:
      type: "object"
      required:
        - "username"
        - "user_email"
        - "base_url"
      properties:
        username:
          type: "string"
          minLength: 1
        user_email:
          type: "string"
          format: "email"
        base_url:
          type: "string"
          description: "Registered sender base URL"
          format: "uri"
    IdentityResponse:
      type: "object"
      required:
        - "success"
        - "data"
      properties:
        success:
          type: "boolean"
          const: true
        data:
          type: "object"
          required:
            - "username_exists"
            - "email_exists"
          properties:
            username_exists:
              type: "boolean"
            email_exists:
              type: "boolean"
    UserFields:
      type: "object"
      properties:
        user_nicename:
          type: "string"
        user_url:
          type: "string"
        user_email:
          type: "string"
          format: "email"
        display_name:
          type: "string"
        nickname:
          type: "string"
        first_name:
          type: "string"
        last_name:
          type: "string"
        description:
          type: "string"
        rich_editing:
          type: "string"
        syntax_highlighting:
          type: "string"
        comment_shortcuts:
          type: "string"
        admin_color:
          type: "string"
        user_registered:
          type: "string"
        locale:
          type: "string"
        use_ssl:
          type:
            - "string"
            - "boolean"
            - "integer"
        show_admin_bar_front:
          type:
            - "string"
            - "boolean"
        user_pass:
          type: "string"
          description: "New password inside encrypted wprusdata"
        roles:
          "$ref": "#/components/schemas/RoleChanges"
    RoleChanges:
      type: "object"
      properties:
        set:
          oneOf:
            -
              type: "string"
            -
              const: false
        add:
          oneOf:
            -
              type: "array"
              items:
                type: "string"
            -
              const: false
    CreateRequest:
      allOf:
        -
          "$ref": "#/components/schemas/BaseRequest"
        -
          "$ref": "#/components/schemas/UserFields"
        -
          type: "object"
          required:
            - "user_email"
    UpdateRequest:
      allOf:
        -
          "$ref": "#/components/schemas/BaseRequest"
        -
          "$ref": "#/components/schemas/UserFields"
        -
          type: "object"
          properties:
            user_activation_key:
              type: "string"
    DeleteRequest:
      allOf:
        -
          "$ref": "#/components/schemas/BaseRequest"
        -
          type: "object"
          properties:
            reassign_username:
              oneOf:
                -
                  type: "string"
                -
                  const: false
              description: "Account to receive deleted content"
    PasswordRequest:
      allOf:
        -
          "$ref": "#/components/schemas/BaseRequest"
        -
          type: "object"
          required:
            - "user_pass"
          properties:
            user_pass:
              type: "string"
              description: "New password inside encrypted wprusdata"
              minLength: 1
    MetadataAddEntry:
      type: "object"
      required:
        - "meta_value"
        - "unique"
      properties:
        meta_value: {}
        unique:
          type: "boolean"
    MetadataUpdateEntry:
      type: "object"
      required:
        - "meta_value"
        - "prev_value"
      properties:
        meta_value: {}
        prev_value: {}
    MetadataDeleteEntry:
      type: "object"
      required:
        - "meta_value"
        - "delete_all"
      properties:
        meta_value: {}
        delete_all:
          type: "boolean"
    MetadataRequest:
      allOf:
        -
          "$ref": "#/components/schemas/BaseRequest"
        -
          type: "object"
          properties:
            add:
              type: "object"
              additionalProperties:
                type: "array"
                items:
                  "$ref": "#/components/schemas/MetadataAddEntry"
            update:
              type: "object"
              additionalProperties:
                type: "array"
                items:
                  "$ref": "#/components/schemas/MetadataUpdateEntry"
            delete:
              type: "object"
              additionalProperties:
                type: "array"
                items:
                  "$ref": "#/components/schemas/MetadataDeleteEntry"
    AdminRequest:
      allOf:
        -
          "$ref": "#/components/schemas/BaseRequest"
        -
          type: "object"
          required:
            - "action"
            - "data"
          properties:
            action:
              type: "string"
              enum:
                - "ping"
                - "outgoing_meta"
            data:
              oneOf:
                -
                  "$ref": "#/components/schemas/PingData"
                -
                  "$ref": "#/components/schemas/OutgoingMetaData"
    PingData:
      type: "object"
      required:
        - "base_url"
        - "target_action"
        - "direction"
      properties:
        base_url:
          type: "string"
          description: "Registered sender URL"
          format: "uri"
        target_action:
          type: "string"
          enum:
            - "login"
            - "logout"
            - "create"
            - "update"
            - "delete"
            - "password"
            - "role"
            - "meta"
        direction:
          type: "string"
          enum:
            - "incoming"
            - "outgoing"
    OutgoingMetaData:
      type: "object"
      required:
        - "base_url"
      properties:
        base_url:
          type: "string"
          description: "Registered sender URL"
          format: "uri"
    LoginRequest:
      allOf:
        -
          "$ref": "#/components/schemas/BaseRequest"
        -
          type: "object"
          properties:
            remember:
              type:
                - "boolean"
                - "integer"
                - "string"
            callback_url:
              type: "string"
              description: "Redirect destination when required"
              format: "uri"
    LogoutRequest:
      "$ref": "#/components/schemas/BaseRequest"
    ActionSuccessResponse:
      type: "object"
      required:
        - "success"
        - "data"
      properties:
        success:
          type: "boolean"
          const: true
        data:
          type: "boolean"
          const: true
    AdminSuccessResponse:
      type: "object"
      required:
        - "success"
        - "data"
      properties:
        success:
          type: "boolean"
          const: true
        data:
          oneOf:
            -
              type: "string"
            -
              type: "array"
              items:
                type: "string"
    RoleErrorDetails:
      type: "object"
      required:
        - "account_saved"
        - "applied_roles"
        - "rejected_roles"
      properties:
        account_saved:
          type: "boolean"
          const: true
          description: "The account creation or update already succeeded."
        applied_roles:
          type: "array"
          items:
            type: "string"
          description: "Roles that were successfully set or added."
        rejected_roles:
          type: "array"
          items:
            type: "string"
          description: "Requested roles not accepted by the receiver."
    ReassignmentErrorDetails:
      type: "object"
      required:
        - "account_deleted"
        - "content_reassigned"
      properties:
        account_deleted:
          type: "boolean"
          const: true
        content_reassigned:
          type: "boolean"
          const: false
    MetadataRejectedEntry:
      type: "object"
      required:
        - "operation"
        - "key"
        - "code"
      properties:
        operation:
          type: "string"
          enum:
            - "add"
            - "update"
            - "delete"
        key:
          type: "string"
        code:
          type: "string"
          enum:
            - "metadata_key_invalid"
            - "metadata_key_not_allowed"
            - "metadata_change_failed"
    MetadataErrorDetails:
      type: "object"
      required:
        - "applied"
        - "rejected"
      properties:
        applied:
          type: "integer"
          minimum: 0
          description: "Number of metadata operations that succeeded."
        rejected:
          type: "array"
          items:
            "$ref": "#/components/schemas/MetadataRejectedEntry"
    ErrorResponse:
      type: "object"
      required:
        - "success"
        - "data"
      properties:
        success:
          type: "boolean"
          const: false
        data:
          type: "object"
          required:
            - "code"
          properties:
            code:
              type: "string"
              description: "Machine-readable cause of the failure. See x-wprus-error-codes on the operation."
            message:
              type: "string"
              description: "Optional human-readable explanation."
            details:
              type: "object"
              description: "Optional information about changes completed before the error. See x-wprus-error-details on the operation."
              additionalProperties: true
